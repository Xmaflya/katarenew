name: "@s5gydl kata 自动续期任务"

on:
  schedule:
    # 每天执行：UTC 22:00 (北京时间 次日早上 06:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install Dependencies
      run: |
        echo "📦 安装 Playwright 及运行依赖..."
        npm install playwright
        npx playwright install-deps chromium
        npx playwright install chromium
      
    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON || secrets.USERS }}
        USERS: ${{ secrets.USERS || secrets.USERS_JSON }}
        PROXY_URL: ${{ secrets.PROXY_URL }}
        SUB_URL: ${{ secrets.SUB_URL }}
        S5_URL: ${{ secrets.S5_URL }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node kata_renew.js

    - name: Commit Renew Dates
      if: always()
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add renew_dates.json || true
        git diff --cached --quiet renew_dates.json || git commit -m "chore: update renew dates [skip ci]"
        for i in {1..5}; do
          git pull --rebase --autostash || true
          if git push; then
            break
          fi
          echo "⚠️ Push failed, retrying in 5 seconds ($i/5)..."
          sleep 5
        done

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: screenshots/
